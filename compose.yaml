services:
  web:
    build:
      context: ..
      dockerfile: gmxflow-web/Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY no .env}
    volumes:
      - gmxflow_data:/data
    ports:
      - "8000:8000"
  worker:
    build:
      context: ..
      dockerfile: gmxflow-web/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-m", "gmxflow_web.worker"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY no .env}
    volumes:
      - gmxflow_data:/data
    depends_on:
      - web
volumes:
  gmxflow_data:
